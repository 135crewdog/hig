# Publishes the HIG page, with the starter app at starter/, to GitHub Pages on every push to main.
# One-time setup in the repo: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # A deploy waits for the starter's tests to pass.
  test:
    uses: ./.github/workflows/starter.yml
    permissions:
      contents: read
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p _site && cp index.html hig.css _site/ && cp -r starter/app _site/starter
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
