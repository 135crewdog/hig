# Unit tests and the browser smoke test, on every push and pull request, and as the gate
# in front of the Pages deploy (pages.yml calls this workflow).
# The smoke test is Chromium; iPhone Safari is checked by hand before a pull request is merged.
name: Tests
on:
  # Every push, main included: pages.yml only runs for changes to app/, so a change to the tests
  # or workflows on main is tested here.
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      # Playwright is a development tool, not an app dependency: nothing is saved to the repository.
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/smoke.js
